name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: rathole
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            exe: rathole

          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: rathole
          - os: macos-15
            target: aarch64-apple-darwin
            exe: rathole

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: rathole.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: rathole.exe
    env:
      CARGO_FEATURE_ARGS: ${{ endsWith(matrix.target, '-linux-musl') && '--features vendored-tls' || '' }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.79
          default: true

      - name: Set up musl C compiler
        if: endsWith(matrix.target, '-linux-musl')
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_key="${RUST_TARGET//-/_}"
          echo "CC_${target_key}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install OpenSSL
        if: startsWith(matrix.os, 'macos-')
        run: brew install openssl@3

      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: Run tests
        run: cargo test --locked --release --target ${{ matrix.target }} --verbose ${{ env.CARGO_FEATURE_ARGS }}
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ env.CARGO_FEATURE_ARGS }}
      - name: Verify static Linux binary
        if: endsWith(matrix.target, '-linux-musl')
        env:
          RELEASE_BINARY: target/${{ matrix.target }}/release/${{ matrix.exe }}
        run: |
          elf_headers=$(readelf -lW -dW "$RELEASE_BINARY")
          if grep -E '^[[:space:]]*INTERP[[:space:]]|\(NEEDED\)' <<< "$elf_headers"; then
            echo 'Linux release binary must be statically linked.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rathole-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
      - name: Package Linux and macOS release (tar.gz)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: >-
          tar -czf "target/${{ matrix.target }}/release/rathole-${{ matrix.target }}.tar.gz"
          -C "target/${{ matrix.target }}/release" "${{ matrix.exe }}"
      - name: Package Windows release (zip)
        if: runner.os == 'Windows'
        uses: TheDoctor0/zip-release@0.6.1
        with:
          type: zip
          filename: rathole-${{ matrix.target }}.zip
          directory: target/${{ matrix.target }}/release/
          path: ${{ matrix.exe }}
      - name: Publish release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.target }}/release/rathole-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          generate_release_notes: true
          draft: true
